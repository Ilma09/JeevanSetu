name: Build
on:
  push:
    branches: [main, feature/backend-integration]
  pull_request:
    branches: [main]
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --prefix server
      - run: npx prisma generate --schema server/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jeevansetu
